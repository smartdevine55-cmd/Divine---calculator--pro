<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <title>Divine Calculator Pro</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 20px; background: linear-gradient(135deg, #101827, #172b46);
      color: #f7f9fc; font-family: system-ui, Arial, sans-serif;
    }
    .calculator {
      width: min(100%, 390px); padding: 22px; border-radius: 25px;
      background: #182437; box-shadow: 0 18px 50px #0008;
      border: 1px solid #ffffff18;
    }
    h1 { margin: 0 0 5px; font-size: 23px; text-align: center; }
    .tagline { margin: 0 0 20px; text-align: center; color: #a9b8cb; font-size: 13px; }
    #display {
      width: 100%; height: 85px; margin-bottom: 16px; padding: 15px;
      border: 1px solid #ffffff20; border-radius: 15px; background: #0d1726;
      color: white; text-align: right; font-size: 32px; outline: none;
    }
    .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    button {
      min-height: 62px; border: 0; border-radius: 15px; background: #263951;
      color: white; font-size: 21px; font-weight: 600; cursor: pointer;
      touch-action: manipulation;
    }
    button:active { transform: scale(.96); }
    .operator { background: #245c83; }
    .utility { background: #42536a; }
    .equals { background: #16a078; }
    .zero { grid-column: span 2; }
    footer { margin-top: 18px; text-align: center; color: #91a3b9; font-size: 12px; }
  </style>
</head>
<body>
  <main class="calculator">
    <h1>Divine Calculator Pro</h1>
    <p class="tagline">Simple • Fast • Reliable</p>
    <input id="display" type="text" value="0" aria-label="Calculator display" readonly>
    <section class="keys" aria-label="Calculator buttons">
      <button class="utility" data-action="clear">AC</button>
      <button class="utility" data-action="delete">DEL</button>
      <button class="utility" data-value="%">%</button>
      <button class="operator" data-value="÷">÷</button>

      <button data-value="7">7</button><button data-value="8">8</button>
      <button data-value="9">9</button><button class="operator" data-value="×">×</button>

      <button data-value="4">4</button><button data-value="5">5</button>
      <button data-value="6">6</button><button class="operator" data-value="-">−</button>

      <button data-value="1">1</button><button data-value="2">2</button>
      <button data-value="3">3</button><button class="operator" data-value="+">+</button>

      <button class="zero" data-value="0">0</button>
      <button data-value=".">.</button><button class="equals" data-action="equals">=</button>
    </section>
    <footer>Made by Divine</footer>
  </main>
  <script>
    const display = document.getElementById('display');
    let expression = '';
    let justCalculated = false;

    function show() { display.value = expression || '0'; }
    function add(value) {
      if (justCalculated && /[0-9.]/.test(value)) expression = '';
      justCalculated = false;
      if (value === '.') {
        const current = expression.split(/[+\-×÷%]/).pop();
        if (current.includes('.')) return;
        if (!current) value = '0.';
      }
      expression += value;
      show();
    }
    function calculate() {
      if (!expression) return;
      try {
        let safe = expression.replace(/×/g, '*').replace(/÷/g, '/');
        if (!/^[0-9+\-*/%.() ]+$/.test(safe)) throw new Error('Invalid');
        // Percentage is interpreted as division by 100.
        safe = safe.replace(/(\d+(?:\.\d+)?)%/g, '($1/100)');
        const result = Function('"use strict"; return (' + safe + ')')();
        if (!Number.isFinite(result)) throw new Error('Math error');
        expression = String(Number(result.toPrecision(12)));
        justCalculated = true;
        show();
      } catch {
        display.value = 'Error';
        expression = '';
        justCalculated = false;
      }
    }
    document.querySelector('.keys').addEventListener('click', event => {
      const button = event.target.closest('button');
      if (!button) return;
      if (button.dataset.action === 'clear') { expression = ''; justCalculated = false; show(); }
      else if (button.dataset.action === 'delete') { expression = expression.slice(0, -1); justCalculated = false; show(); }
      else if (button.dataset.action === 'equals') calculate();
      else add(button.dataset.value);
    });
    document.addEventListener('keydown', event => {
      if (/^[0-9.]$/.test(event.key)) add(event.key);
      else if (event.key === '+') add('+');
      else if (event.key === '-') add('-');
      else if (event.key === '*') add('×');
      else if (event.key === '/') { event.preventDefault(); add('÷'); }
      else if (event.key === 'Enter' || event.key === '=') calculate();
      else if (event.key === 'Backspace') { expression = expression.slice(0, -1); show(); }
      else if (event.key === 'Escape') { expression = ''; show(); }
    });
  </script>
</body>
</html>
